openapi: 3.1.0
info:
  title: HASHI Server API
  version: 0.1.0
  summary: Human Agent Secure Handshake Interface - resolution, redeem, sealed messages and the inbox.
  description: |
    Companion to the HASHI Specification, version 0.1. HASHI gives people an
    address, records trust levels (0-9) and carries end-to-end encrypted
    messages between agents. A sender's agent sends a sealed message to the
    recipient's HASHI server, which checks trust, stamps it and queues it.
    The recipient's agents pick it up when they come online. The server
    can't read messages and doesn't route them.

    Authentication: every operation except resolveHashi and
    publishDocument MUST carry HTTP
    Message Signatures (RFC 9421) made with the caller's agent or device
    key, covering @method, @target-uri, created and (with a body)
    content-digest; sends also cover hashi-grant, hashi-reply and
    hashi-delegation when present. The caller sends its delegation in
    Hashi-Delegation. On redeem and send, the delegation's iss MUST equal
    the HID of the claimed hashi (requester.hashi on redeem, from on send).
    On inbox and grants operations, the delegation MUST belong to the
    owner. Grants calls MUST be rejected if created is over 5 minutes old
    or a request with the same signature base was seen before.
    OpenAPI cannot express RFC 9421, so the headers are listed as
    parameters; verification rules are in the specification.

    Network rules: HTTPS only, no redirects, no connections to
    non-globally-reachable addresses, requests and responses capped at
    64 KiB, except responses from the owner's own server to inbox and
    grants calls.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{domain}
    description: Domain hosting the well-known hashi document.
    variables:
      domain:
        default: my.domain
  - url: https://{endpoint}
    description: HASHI server endpoint, as given in the hashi document.
    variables:
      endpoint:
        default: hashi.my.domain/v1

paths:
  /.well-known/hashi/{local}:
    get:
      operationId: resolveHashi
      summary: Resolve a hashi to its hashi document.
      description: |
        Clients MUST NOT follow redirects. This path is also the HTTPS link
        form used in QR codes; a browser request (Accept: text/html) gets the
        owner's human-facing page instead. Offers ride in the URI fragment and
        are never sent to the server.
      servers:
        - url: https://{domain}
          variables:
            domain:
              default: my.domain
      parameters:
        - name: local
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LocalPart'
      responses:
        '200':
          description: Hashi document.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/HashiDocument'
        '404':
          description: No such hashi.
        '429':
          $ref: '#/components/responses/RateLimited'

  /redeem:
    post:
      operationId: redeemOffer
      summary: Redeem an offer or short code and receive a grant.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '200':
          description: Grant recorded.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/RedeemResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '410':
          description: Offer or code already used or expired.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /messages:
    post:
      operationId: sendMessage
      summary: Send a sealed message to an owner's inbox.
      description: |
        The server checks the sender's signature, grant or reply token,
        stamps the message with the effective level and queues it in the
        owner's incoming queue. It does not route or hold messages for
        approval. Level-0 messages without a valid reply token MUST NOT carry
        an envelope. The whole request MUST NOT exceed 64 KiB.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
        - name: Hashi-Grant
          in: header
          required: false
          description: Grant JWS. Optional; the server's grant record is authoritative.
          schema:
            $ref: '#/components/schemas/JWS'
        - name: Hashi-Reply
          in: header
          required: false
          description: Reply token from one of the recipient's agents, for a reply on its thread.
          schema:
            $ref: '#/components/schemas/JWS'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: "yeah: stamped and queued."
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/SendAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "nah: not accepted. No reason given; every nah is identical."
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/SendRejected'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox:
    get:
      operationId: listInbox
      summary: List the owner's inbox. Called by the owner's agents and devices.
      description: |
        Listing is the baseline every server and agent MUST support, so
        polling always works. The server does not route: every one of the
        owner's agents sees the same inbox and decides what to take.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
        - name: queue
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, processing]
        - name: intent
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Intent'
        - name: thread
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ThreadId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Messages waiting.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/InboxList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox/{messageId}/claim:
    post:
      operationId: claimMessage
      summary: Move a message from incoming to processing. Agents only; first claim wins.
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '200':
          description: Claimed.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already claimed.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox/{messageId}/release:
    post:
      operationId: releaseMessage
      summary: Move a message back to incoming. The claiming agent or one of the owner's devices.
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '200':
          description: Released.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox/{messageId}:
    delete:
      operationId: deleteMessage
      summary: Remove a message. The claiming agent or one of the owner's devices.
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox/wake:
    get:
      operationId: listWakeChannels
      summary: OPTIONAL. Wake-up channels this server supports.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '200':
          description: Supported channels.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/WakeChannels'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: registerWakeChannel
      summary: OPTIONAL. Register a wake-up channel for the calling agent.
      description: |
        Wake-up notices say only that the inbox changed. They MUST NOT carry
        any part of a message, its stamp or its sender. For webpush, params
        is the agent's push subscription and the push message body is empty.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/WakeRegistration'
      responses:
        '204':
          description: Registered.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /document:
    put:
      operationId: publishDocument
      summary: Publish a new version of the owner's hashi document.
      description: |
        Self-authorising: the identity-signed binding is the authorisation,
        so no HTTP signature or delegation is used. The server accepts the
        document only if it verifies, is for a hashi hosted here with this
        server's endpoint, binds this server's current key or its srv_next and, when a document is
        already held, has the same HID, a higher epoch and a rotation chain
        extending the held one. Whether a first publish is accepted is server
        policy; a reset (new HID) is not done through this call.
      security: []
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Stored. The document as now served, fresh included.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/HashiDocument'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: First publish not allowed by server policy, or the document isn't for this server (hashi, endpoint or binding srv).
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The epoch isn't higher, the rotation chain doesn't extend the held one, or the HID differs.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /grants:
    get:
      operationId: listGrants
      summary: List the grants the owner has given, and refused HIDs. Any of the owner's agents or devices.
      description: Not subject to the 64 KiB response cap, as it comes from the owner's own server.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '200':
          description: The owner's grants.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/GrantList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /grants/{hid}:
    put:
      operationId: lowerGrant
      summary: Lower or remove a grant, or refuse a HID. One of the owner's devices only.
      description: |
        The level MUST NOT be higher than the recorded one (0 if none);
        raising needs a new offer. Level 0 removes the grant. refuse true
        sets the level to 0 and refuses the HID (its messages get nah, its
        redemptions are answered as expired); false lifts a refusal without
        granting anything; omitted keeps the setting.
      parameters:
        - name: hid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HID'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/LowerGrant'
      responses:
        '200':
          description: The entry as now recorded.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The level is higher than the recorded one.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  parameters:
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      description: RFC 9421 signature input.
      schema:
        type: string
    Signature:
      name: Signature
      in: header
      required: true
      description: RFC 9421 signature.
      schema:
        type: string
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      description: RFC 9530 content digest of the request body.
      schema:
        type: string
    HashiDelegation:
      name: Hashi-Delegation
      in: header
      required: true
      description: Agent or device delegation JWS (contains the signing public key; agent delegations also carry the encryption key).
      schema:
        $ref: '#/components/schemas/JWS'
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
  responses:
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Signature, delegation or key missing or invalid.
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller is not one of the owner's agents or devices, or may not take this action.
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such message.
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Malformed request.
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LocalPart:
      type: string
      pattern: '^[a-z0-9._-]{1,64}$'

    Hashi:
      type: string
      description: Canonical hashi, local#domain, lowercase.
      pattern: '^[a-z0-9._-]{1,64}#[a-z0-9.-]{1,253}$'
      examples: ['john#my.domain']

    HID:
      type: string
      pattern: '^hid:[A-Za-z0-9_-]{43}$'

    TrustLevel:
      type: integer
      minimum: 0
      maximum: 9
      description: 0 = public, 9 = highest. 1-8 are owner-defined.

    DisplayName:
      type: string
      maxLength: 128
      description: |
        Presentation only. NFC-normalised, no Cc/Cf characters. MUST NOT be
        used as an identity or trust signal.

    JWS:
      type: string
      description: Compact JWS.
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'

    PublicJWK:
      description: Ed25519 (EdDSA) or P-256 (ES256) public key.
      oneOf:
        - type: object
          required: [kty, crv, x]
          properties:
            kty:
              const: OKP
            crv:
              const: Ed25519
            x:
              type: string
            kid:
              type: string
        - type: object
          required: [kty, crv, x, y]
          properties:
            kty:
              const: EC
            crv:
              const: P-256
            x:
              type: string
            y:
              type: string
            kid:
              type: string

    Intent:
      type: string
      description: A token agents may use to decide which messages are theirs; never free text.
      pattern: '^[a-z][a-z0-9-]{0,31}$'

    HttpsUrl:
      type: string
      format: uri
      pattern: '^https://'

    Grant:
      type: object
      required: [hid, level, refused, updated]
      properties:
        hid:
          $ref: '#/components/schemas/HID'
        hashi:
          $ref: '#/components/schemas/Hashi'
        level:
          $ref: '#/components/schemas/TrustLevel'
        refused:
          type: boolean
        updated:
          type: integer
          description: When the entry last changed or an offer was last redeemed for it (seconds since the epoch).

    GrantList:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'

    LowerGrant:
      type: object
      required: [level]
      properties:
        level:
          $ref: '#/components/schemas/TrustLevel'
        refuse:
          type: boolean

    PublishRequest:
      type: object
      required: [version, hashi, hid, epoch, identity_key, binding, endpoint, agents, rotations, revoked]
      description: A hashi document without fresh, which the server adds.
      properties:
        version:
          $ref: '#/components/schemas/HashiDocument/properties/version'
        hashi:
          $ref: '#/components/schemas/HashiDocument/properties/hashi'
        display_name:
          $ref: '#/components/schemas/HashiDocument/properties/display_name'
        hid:
          $ref: '#/components/schemas/HashiDocument/properties/hid'
        epoch:
          $ref: '#/components/schemas/HashiDocument/properties/epoch'
        identity_key:
          $ref: '#/components/schemas/HashiDocument/properties/identity_key'
        binding:
          $ref: '#/components/schemas/HashiDocument/properties/binding'
        endpoint:
          $ref: '#/components/schemas/HashiDocument/properties/endpoint'
        level0:
          $ref: '#/components/schemas/HashiDocument/properties/level0'
        agents:
          $ref: '#/components/schemas/HashiDocument/properties/agents'
        rotations:
          $ref: '#/components/schemas/HashiDocument/properties/rotations'
        revoked:
          $ref: '#/components/schemas/HashiDocument/properties/revoked'
    HashiDocument:
      type: object
      required: [version, hashi, hid, epoch, identity_key, binding, fresh, endpoint, agents, rotations, revoked]
      description: Every field except binding, fresh, rotations and srv_next is covered by the identity-signed binding.
      properties:
        version:
          type: string
          examples: ['0.1']
        hashi:
          $ref: '#/components/schemas/Hashi'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        hid:
          $ref: '#/components/schemas/HID'
        epoch:
          type: integer
          minimum: 0
          description: Monotonic; clients reject documents with an epoch lower than the one pinned.
        identity_key:
          $ref: '#/components/schemas/PublicJWK'
        binding:
          $ref: '#/components/schemas/JWS'
        fresh:
          $ref: '#/components/schemas/JWS'
          description: Server-key-signed {hid, epoch, iat, srv_next when the server is changing key}, re-signed at least hourly; rejected if older than 24 hours.
        endpoint:
          $ref: '#/components/schemas/HttpsUrl'
        level0:
          type: object
          properties:
            accept:
              type: boolean
              default: false
        agents:
          type: array
          description: Delegations of the agents that receive the owner's messages. New messages are sealed to every one.
          items:
            $ref: '#/components/schemas/JWS'
        rotations:
          type: array
          description: Rotation chain, oldest first.
          items:
            $ref: '#/components/schemas/JWS'
        revoked:
          type: array
          description: jti values of revoked, unexpired device and agent delegations.
          items:
            type: string
        srv_next:
          $ref: '#/components/schemas/PublicJWK'
          description: The server key this server will move to. Set by the server and not covered by the binding. The owner's app acts on it only when the same value is inside a fresh signed by the current server key, and SHOULD then publish a binding whose srv is this key.

    RedeemRequest:
      type: object
      required: [requester]
      properties:
        offer:
          $ref: '#/components/schemas/JWS'
        code:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}-?[0-9A-HJKMNP-TV-Z]{4}$'
        to:
          $ref: '#/components/schemas/Hashi'
        requester:
          type: object
          description: The requester's own hashi.
          required: [hashi]
          properties:
            hashi:
              $ref: '#/components/schemas/Hashi'
          additionalProperties: false
      oneOf:
        - required: [offer]
        - required: [code, to]

    RedeemResponse:
      type: object
      required: [grant, level]
      properties:
        grant:
          $ref: '#/components/schemas/JWS'
        level:
          $ref: '#/components/schemas/TrustLevel'

    ThreadId:
      type: string
      description: Thread ID. A new thread's ID carries at least 128 bits of randomness; replies repeat it.
      pattern: '^[A-Za-z0-9_-]{16,64}$'

    JWE:
      type: object
      description: |
        JWE in General JSON Serialization (RFC 7516), alg ECDH-ES+A256KW,
        enc A256GCM, one recipient per sealed-to agent with kid set to that
        agent's delegation jti. The plaintext is a compact JWS
        (typ hashi-msg+jwt) signed by the sender's agent key.
      required: [protected, recipients, iv, ciphertext, tag]
      properties:
        protected:
          type: string
        unprotected:
          type: object
        recipients:
          type: array
          minItems: 1
          items:
            type: object
            required: [header, encrypted_key]
            properties:
              header:
                type: object
                required: [kid]
                properties:
                  kid:
                    type: string
              encrypted_key:
                type: string
        iv:
          type: string
        ciphertext:
          type: string
        tag:
          type: string

    SendRequest:
      type: object
      required: [to, from, thread]
      additionalProperties: false
      description: Outside the envelope, messages carry no free-text fields.
      properties:
        to:
          $ref: '#/components/schemas/Hashi'
        from:
          $ref: '#/components/schemas/Hashi'
        intent:
          $ref: '#/components/schemas/Intent'
        thread:
          $ref: '#/components/schemas/ThreadId'
        envelope:
          $ref: '#/components/schemas/JWE'
        reply_token:
          $ref: '#/components/schemas/JWS'
          description: A reply token (typ hashi-reply+jwt) the sender offers the recipient.

    SendAccepted:
      type: object
      required: [result, id]
      properties:
        result:
          const: 'yeah'
        id:
          type: string
          description: Inbox message ID.

    SendRejected:
      type: object
      required: [result]
      properties:
        result:
          const: 'nah'
      additionalProperties: false
      description: Carries no reason; identical however it was reached.

    InboxEntry:
      type: object
      required: [id, queue, stamp]
      properties:
        id:
          type: string
        queue:
          type: string
          enum: [incoming, processing]
        stamp:
          $ref: '#/components/schemas/JWS'
          description: Server-key-signed stamp (typ hashi-stamp+jwt) with sender, level, intent, thread and ciphertext hash.
        envelope:
          $ref: '#/components/schemas/JWE'
        reply_token:
          $ref: '#/components/schemas/JWS'
        claimed_by:
          type: [string, 'null']
          description: jti of the claiming agent's delegation, for messages in processing.

    InboxList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/InboxEntry'

    WakeChannels:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            type: string
            examples: ['webpush']

    WakeRegistration:
      type: object
      required: [channel, params]
      properties:
        channel:
          type: string
        params:
          type: object
          description: Channel-specific. For webpush, the agent's push subscription.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string
