openapi: 3.1.0
info:
  title: HASHI Server API
  version: 0.1.0
  summary: Human Agent Secure Handshake Interface - resolution, redeem, sealed messages and the inbox.
  description: |
    Companion to the HASHI Specification, version 0.1. HASHI gives people an
    address, records trust levels (0-9) and carries end-to-end encrypted
    messages between agents. A sender's agent sends a sealed message to the
    recipient's HASHI server, which checks trust, stamps it and queues it.
    The recipient's agents pick it up when they come online. The server
    can't read messages and doesn't route them.

    Authentication: every operation except resolveHashi,
    getServerDocument, fetchOffer and publishDocument MUST carry HTTP
    Message Signatures (RFC 9421) made with the caller's agent or device
    key, covering @method, @authority, @path, created, each query
    parameter by name (@query-param) and (with a body) content-digest;
    sends also cover hashi-reply and hashi-delegation when present.
    Servers MUST reject a request that repeats a query parameter
    name or carries one the signature doesn't cover. Query parameter
    names and values MUST use only ASCII letters, digits, -, . and _.
    The caller sends its delegation in
    Hashi-Delegation. On redeem and send, the delegation's iss MUST equal
    the HID of the claimed hashi (requester.hashi on redeem, from on send).
    Redeem MUST be signed by a device delegation: only a person accepts
    an offer.
    On inbox, grants and rules operations, the delegation MUST belong to
    the owner, and an agent's delegation MUST also be listed in the
    owner's agents. Grants calls MUST be rejected if created is over 5 minutes old
    or a request with the same signature base was seen before.
    OpenAPI cannot express RFC 9421, so the headers are listed as
    parameters; verification rules are in the specification.

    Network rules: HTTPS only, no redirects, no connections to
    non-globally-reachable addresses, requests and responses capped at
    64 KiB, except responses from the owner's own server to inbox and
    grants calls.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{domain}
    description: Domain hosting the well-known hashi document.
    variables:
      domain:
        default: my.domain
  - url: https://{endpoint}
    description: HASHI server endpoint, as given in the hashi document.
    variables:
      endpoint:
        default: hashi.my.domain/v1

paths:
  /.well-known/hashi:
    get:
      operationId: getServerDocument
      summary: Find a domain's HASHI endpoint, server key and sign-up page.
      description: |
        For an app that knows only a domain, for example before signing up.
        Clients MUST NOT follow redirects. A 404 means the domain has no
        server document, so apps can't sign up there.
      servers:
        - url: https://{domain}
          variables:
            domain:
              default: my.domain
      responses:
        '200':
          description: Server document.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/ServerDocument'
        '404':
          description: No server document on this domain.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /.well-known/hashi/{local}:
    get:
      operationId: resolveHashi
      summary: Resolve a hashi to its hashi document.
      description: |
        Clients MUST NOT follow redirects. This path is also the HTTPS link
        form used in QR codes; a browser request (Accept: text/html) gets the
        owner's human-facing page instead. Offers ride in the URI fragment and
        are never sent to the server.
      servers:
        - url: https://{domain}
          variables:
            domain:
              default: my.domain
      parameters:
        - name: local
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LocalPart'
      responses:
        '200':
          description: Hashi document.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/HashiDocument'
        '404':
          description: No such hashi on this server.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /h/{code}:
    get:
      operationId: fetchOffer
      summary: Fetch the offer behind a short link.
      description: |
        This path is the short link itself. A request whose Accept header
        names application/hashi+json gets the offer; any other, even one with
        Accept: */*, gets the "Got a hashi?" page, which MUST NOT include the
        offer or say who it's from. Fetching doesn't use the link up. A link
        works only until someone first redeems its offer, even a multi-use
        one, or a refused HID tries to. It also stops once the offer no longer
        verifies, for example because it expired, its device was revoked, or
        the hashi was reset or deleted. Clients MUST NOT follow redirects.
      servers:
        - url: https://{domain}
          variables:
            domain:
              default: my.domain
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ShortLinkCode'
      responses:
        '200':
          description: The offer.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/StoredOffer'
        '404':
          description: Unknown code, or the link has stopped, with the same answer whichever it is.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /redeem:
    post:
      operationId: redeemOffer
      summary: Redeem an offer. One of the redeemer's devices only; nothing changes until the owner confirms and picks the level.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '202':
          description: No body. The acceptance waits for the owner to confirm, and the redeemer isn't told the level the owner picks.
        '400':
          description: Malformed request, or an offer_back that doesn't verify, has expired or isn't for requester.hashi.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Not signed by a device delegation.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such hashi on this server, the same answer Resolve gives.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Offer already used or expired.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /redeem/status:
    post:
      operationId: redeemStatus
      summary: Ask whether the owner has confirmed you. One of the redeemer's devices only; never says the level.
      description: |
        confirmed is true if the owner records a level of 1 or more for the
        caller's HID and hasn't refused it. It is false alike while the
        acceptance is pending, after a decline, once it was dropped after 30
        days, if none was made and if the HID is refused (specification
        Section 8.2). The answer is a display hint and isn't signed.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/RedeemStatusRequest'
      responses:
        '200':
          description: Whether the caller has been confirmed.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/RedeemStatus'
        '400':
          description: Malformed request.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Not signed by a device delegation.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such hashi on this server, the same answer Resolve gives.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /messages:
    post:
      operationId: sendMessage
      summary: Send a sealed message to an owner's inbox.
      description: |
        The server checks the sender's signature, grant or reply token,
        stamps the message with the effective level and queues it in the
        owner's incoming queue. It does not route or hold messages for
        approval. A level-0 message without a valid reply token gets nah
        unless the owner's level0.accept is true, in which case the request
        body MUST NOT exceed 8 KiB. The whole request MUST NOT exceed 64 KiB.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
        - name: Hashi-Reply
          in: header
          required: false
          description: Reply token from one of the recipient's agents, for a reply on its thread.
          schema:
            $ref: '#/components/schemas/JWS'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: "yea: stamped and queued."
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/SendAccepted'
        '400':
          description: Malformed request, or a level-0 message without a valid reply token whose body is over 8 KiB.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "nah: not accepted. No reason given; every nah is identical."
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/SendRejected'
        '404':
          description: No such hashi on this server, the same answer Resolve gives.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox:
    get:
      operationId: listInbox
      summary: List the owner's inbox. Called by the owner's agents and devices.
      description: |
        Listing is the baseline every server and agent MUST support, so
        polling always works. The server does not route: every one of the
        owner's agents sees the same inbox and decides what to take.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
        - name: queue
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, processing]
        - name: intent
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Intent'
        - name: thread
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ThreadId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Messages waiting.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/InboxList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox/{messageId}/claim:
    post:
      operationId: claimMessage
      summary: Move a message from incoming to processing. Agents only; first claim wins.
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '200':
          description: Claimed.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already claimed.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox/{messageId}/release:
    post:
      operationId: releaseMessage
      summary: Move a message back to incoming. The claiming agent or one of the owner's devices.
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '200':
          description: Released.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox/{messageId}:
    delete:
      operationId: deleteMessage
      summary: Remove a message. The claiming agent or one of the owner's devices.
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /inbox/wake:
    get:
      operationId: listWakeChannels
      summary: OPTIONAL. Wake-up channels this server supports.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '200':
          description: Supported channels.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/WakeChannels'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: registerWakeChannel
      summary: OPTIONAL. Register a wake-up channel for the calling agent or owner's app.
      description: |
        Signed by an agent delegation, or by a device delegation for the owner's
        app. One registration per delegation; registering again replaces it.
        Wake-up notices say only that the inbox or grants changed. They MUST NOT carry
        any part of a message, its stamp or its sender. A server MAY wake an app
        only when an acceptance starts waiting, and a notice to an app MAY say that
        one is waiting, but never who accepted, which offer or any level. For
        webpush, params is the push subscription and the push message body is empty.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/WakeRegistration'
      responses:
        '204':
          description: Registered.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /document:
    put:
      operationId: publishDocument
      summary: Publish a new version of the owner's hashi document.
      description: |
        Self-authorising: the identity-signed binding is the authorisation,
        so no HTTP signature or delegation is used. The server accepts the
        document only if it verifies, is for a hashi hosted here with this
        server's endpoint, binds this server's current key or its srv_next and, when a document is
        already held, has the same HID, a higher epoch and a rotation chain
        extending the held one. A server with a sign-up page accepts a first
        publish only from the HID the name was reserved for; otherwise whether
        a first publish is accepted is server policy. A reset (new HID) is not
        done through this call, and a publish accepted here cancels any
        pending reset.
      security: []
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Stored. The document as now served, fresh included.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/HashiDocument'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: A first publish this server doesn't allow (the name is reserved for another HID, or its policy refuses it), or the document isn't for this server (hashi, endpoint or binding srv).
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The epoch isn't higher, the rotation chain doesn't extend the held one, or the HID differs.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /grants:
    get:
      operationId: listGrants
      summary: List the grants the owner has given, refused HIDs and acceptances waiting for the owner. Any of the owner's agents or devices.
      description: Not subject to the 64 KiB response cap, as it comes from the owner's own server.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '200':
          description: The owner's grants.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/GrantList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /grants/{hid}:
    put:
      operationId: setGrant
      summary: Confirm, lower or remove a grant, or refuse a HID. One of the owner's devices only.
      description: |
        The level MUST NOT be higher than the recorded one (0 if none)
        unless the HID has a pending acceptance. A device can't raise a
        grant above its own max_lvl. Level 0 removes the grant. A request for
        a HID with a pending acceptance answers it: a level above the current
        one confirms it at that level, the current level declines it, and a
        lower one declines it and lowers the grant. refuse true
        sets the level to 0 and refuses the HID (its messages get nah, its
        redemptions are answered as expired); false lifts a refusal without
        granting anything; omitted keeps the setting.
      parameters:
        - name: hid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HID'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/SetGrant'
      responses:
        '200':
          description: The entry as now recorded.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The level is higher than the recorded one and nothing is pending.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /rules:
    get:
      operationId: fetchRules
      summary: Get the owner's rules for their agents. Any of the owner's agents or devices.
      description: |
        The rules are a compact JWS signed by the owner's identity key, with
        typ hashi-rules+jwt and the claims iss, hashi, iat and sealed (a JWE
        in General JSON Serialization sealed to the owner's inbox key). The
        server can't read them. Agents check them before following them, as
        the specification describes.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/HashiDelegation'
      responses:
        '200':
          description: The owner's rules.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/RulesBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The server holds no rules for the owner, or doesn't keep rules.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      operationId: storeRules
      summary: Store the owner's rules for their agents. One of the owner's devices only.
      description: |
        The server checks that the JWS's typ is hashi-rules+jwt and its
        signature verifies with identity_key in the document it holds, that
        iss and hashi are that document's hid and hashi, that sealed names
        the kid of that document's inbox_key, and that iat is later than that
        of the rules it holds and no more than 60 seconds in the future. It
        keeps only the latest rules, and drops them when it drops the held
        document after a reset or deletion. A server that doesn't keep rules
        answers 404.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/RulesBody'
      responses:
        '204':
          description: Stored.
        '400':
          description: Malformed request, or rules that fail the server's checks.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Not signed by one of the owner's device delegations.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: This server doesn't keep rules.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The rules' iat isn't later than that of the rules the server holds.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /offers:
    post:
      operationId: storeOffer
      summary: Hold an offer behind a short link. One of the owner's devices only.
      description: |
        The request MUST be signed by a device delegation of the hashi the
        offer is for. The server verifies the offer and its expiry as Redeem
        does. The short link is https://{domain}/h/{code} on the hashi's
        domain. Short links are optional: a server that can't serve /h/ on
        the hashi's domain answers 404, and the app shares the long form
        instead.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          application/hashi+json:
            schema:
              $ref: '#/components/schemas/StoredOffer'
      responses:
        '200':
          description: The code for the short link.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/StoreOfferResponse'
        '400':
          description: Malformed request, or an offer that doesn't verify or has expired.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Not signed by a device delegation of the hashi the offer is for.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No short links on the hashi's domain.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /pictures:
    post:
      operationId: storePicture
      summary: Host a picture for the owner's hashi document. One of the owner's devices only.
      description: |
        The request MUST be signed by a device delegation of a hashi this
        server holds, with content-digest covering the image. The server
        checks, reading the format from the file's first bytes, that it is a
        square JPEG, PNG or WebP (never SVG) of at most 256 pixels a side and
        48 KiB. It stores the image, served with the content type of the
        format it found, where clients can load it, and returns the value
        for the document's picture. The app checks that sha256 is the hash
        of the file it sent. The picture people see changes only when the
        app publishes a document naming it. Hosting pictures is optional: a
        server that doesn't host them answers 404.
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/HashiDelegation'
      requestBody:
        required: true
        content:
          image/jpeg: {}
          image/png: {}
          image/webp: {}
      responses:
        '200':
          description: Stored. The value for the document's picture.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Picture'
        '400':
          description: Not a JPEG, PNG or WebP image, not square, more than 256 pixels a side, or over 48 KiB.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Not signed by a device delegation of a hashi this server holds.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: This server doesn't host pictures.
          content:
            application/hashi+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  parameters:
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      description: RFC 9421 signature input.
      schema:
        type: string
    Signature:
      name: Signature
      in: header
      required: true
      description: RFC 9421 signature.
      schema:
        type: string
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      description: RFC 9530 content digest of the request body.
      schema:
        type: string
    HashiDelegation:
      name: Hashi-Delegation
      in: header
      required: true
      description: Agent or device delegation JWS (contains the signing public key; agent delegations also carry the encryption key).
      schema:
        $ref: '#/components/schemas/JWS'
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
  responses:
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Signature, delegation or key missing or invalid.
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller is not one of the owner's agents or devices, or may not take this action.
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such message.
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Malformed request.
      content:
        application/hashi+json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LocalPart:
      type: string
      pattern: '^[a-z0-9._-]{1,64}$'

    Hashi:
      type: string
      description: Canonical hashi, local#domain, lowercase.
      pattern: '^[a-z0-9._-]{1,64}#[a-z0-9.-]{1,253}$'
      examples: ['john#my.domain']

    HID:
      type: string
      pattern: '^hid:[A-Za-z0-9_-]{43}$'

    TrustLevel:
      type: integer
      minimum: 0
      maximum: 9
      description: 0 = public, 9 = highest. 1-8 are owner-defined.

    DisplayName:
      type: string
      maxLength: 128
      description: |
        Presentation only. NFC-normalised, no Cc/Cf characters. MUST NOT be
        used as an identity or trust signal.

    Picture:
      type: object
      required: [url, sha256]
      description: |
        Presentation only, never an identity or trust signal. A square JPEG,
        PNG or WebP of at most 256 pixels a side and 48 KiB. Clients MUST NOT
        show an image that doesn't match sha256 or breaks those rules, and
        MUST NOT load or show anyone else's picture until the user has saved
        them as a contact or granted them a level above 0.
      properties:
        url:
          $ref: '#/components/schemas/HttpsUrl'
        sha256:
          type: string
          description: SHA-256 of the image file's bytes, in base64url without padding.
          pattern: '^[A-Za-z0-9_-]{43}$'

    JWS:
      type: string
      description: Compact JWS.
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'

    PublicJWK:
      description: Ed25519 (EdDSA) or P-256 (ES256) public key.
      oneOf:
        - type: object
          required: [kty, crv, x]
          properties:
            kty:
              const: OKP
            crv:
              const: Ed25519
            x:
              type: string
            kid:
              type: string
        - type: object
          required: [kty, crv, x, y]
          properties:
            kty:
              const: EC
            crv:
              const: P-256
            x:
              type: string
            y:
              type: string
            kid:
              type: string

    EncryptionJWK:
      description: X25519 or P-256 public key for key agreement (ECDH-ES+A256KW).
      oneOf:
        - type: object
          required: [kty, crv, x, kid]
          properties:
            kty:
              const: OKP
            crv:
              const: X25519
            x:
              type: string
            use:
              const: enc
            kid:
              type: string
        - type: object
          required: [kty, crv, x, y, kid]
          properties:
            kty:
              const: EC
            crv:
              const: P-256
            x:
              type: string
            y:
              type: string
            use:
              const: enc
            kid:
              type: string

    Intent:
      type: string
      description: A token agents may use to decide which messages are theirs; never free text.
      pattern: '^[a-z][a-z0-9-]{0,31}$'

    HttpsUrl:
      type: string
      format: uri
      pattern: '^https://'

    Grant:
      type: object
      required: [hid, level, refused, updated]
      properties:
        hid:
          $ref: '#/components/schemas/HID'
        hashi:
          $ref: '#/components/schemas/Hashi'
        level:
          $ref: '#/components/schemas/TrustLevel'
        refused:
          type: boolean
        pending:
          type: object
          description: Present while someone has redeemed an offer and the owner hasn't answered. Holds the offer's nonce, so the owner's app can tell which offer it was, and any offer_back the redeemer sent. An entry with pending always carries the hashi the redeemer gave.
          required: [nonce]
          properties:
            nonce:
              type: string
            offer_back:
              $ref: '#/components/schemas/JWS'
              description: The redeemer's own offer, for the owner to accept when confirming them.
        updated:
          type: integer
          description: When the entry last changed or an offer was last redeemed for it (seconds since the epoch).

    GrantList:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'

    RulesBody:
      type: object
      required: [rules]
      properties:
        rules:
          $ref: '#/components/schemas/JWS'
          description: The owner's rules, signed by their identity key and sealed to their inbox key.
      additionalProperties: false

    SetGrant:
      type: object
      required: [level]
      properties:
        level:
          $ref: '#/components/schemas/TrustLevel'
        refuse:
          type: boolean

    PublishRequest:
      type: object
      required: [version, hashi, hid, epoch, identity_key, binding, endpoint, agents, inbox_key, inbox_key_copies, rotations, revoked]
      description: A hashi document without fresh, which the server adds.
      properties:
        version:
          $ref: '#/components/schemas/HashiDocument/properties/version'
        hashi:
          $ref: '#/components/schemas/HashiDocument/properties/hashi'
        display_name:
          $ref: '#/components/schemas/HashiDocument/properties/display_name'
        picture:
          $ref: '#/components/schemas/HashiDocument/properties/picture'
        hid:
          $ref: '#/components/schemas/HashiDocument/properties/hid'
        epoch:
          $ref: '#/components/schemas/HashiDocument/properties/epoch'
        identity_key:
          $ref: '#/components/schemas/HashiDocument/properties/identity_key'
        binding:
          $ref: '#/components/schemas/HashiDocument/properties/binding'
        endpoint:
          $ref: '#/components/schemas/HashiDocument/properties/endpoint'
        level0:
          $ref: '#/components/schemas/HashiDocument/properties/level0'
        agents:
          $ref: '#/components/schemas/HashiDocument/properties/agents'
        inbox_key:
          $ref: '#/components/schemas/HashiDocument/properties/inbox_key'
        inbox_key_copies:
          $ref: '#/components/schemas/HashiDocument/properties/inbox_key_copies'
        rotations:
          $ref: '#/components/schemas/HashiDocument/properties/rotations'
        revoked:
          $ref: '#/components/schemas/HashiDocument/properties/revoked'
    HashiDocument:
      type: object
      required: [version, hashi, hid, epoch, identity_key, binding, fresh, endpoint, agents, inbox_key, inbox_key_copies, rotations, revoked]
      description: Every field except binding, fresh, rotations and srv_next is covered by the identity-signed binding.
      properties:
        version:
          type: string
          examples: ['0.1']
        hashi:
          $ref: '#/components/schemas/Hashi'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        picture:
          $ref: '#/components/schemas/Picture'
        hid:
          $ref: '#/components/schemas/HID'
        epoch:
          type: integer
          minimum: 0
          description: Monotonic; clients reject documents with an epoch lower than the one pinned.
        identity_key:
          $ref: '#/components/schemas/PublicJWK'
        binding:
          $ref: '#/components/schemas/JWS'
        fresh:
          $ref: '#/components/schemas/JWS'
          description: Server-key-signed {hid, epoch, iat, srv_next when the server is changing key, reset while a reset or deletion started without the identity key is pending}, re-signed at least hourly; rejected if older than 24 hours. reset is {hashi, action (reset or delete), hid (the new HID, for a reset), at (earliest time it may go ahead)}.
        endpoint:
          $ref: '#/components/schemas/HttpsUrl'
        level0:
          type: object
          properties:
            accept:
              type: boolean
              default: false
              description: If true, strangers can send short messages, with a request body of at most 8 KiB (specification, Section 8.3).
        agents:
          type: array
          description: Delegations of the owner's agents, each app's own agent included. Each gets a copy of the inbox key in inbox_key_copies.
          minItems: 1
          items:
            $ref: '#/components/schemas/JWS'
        inbox_key:
          $ref: '#/components/schemas/EncryptionJWK'
          description: The public half of the inbox key, with its SHA-256 JWK thumbprint (RFC 7638) as kid. Every message to the owner is sealed to this key alone.
        inbox_key_copies:
          $ref: '#/components/schemas/JWE'
          description: The private inbox keys, as a JWE with one recipient per delegation in agents, sealed to that delegation's enc key with its jti as kid. Its plaintext is a JWK Set of private inbox keys (specification, Section 9.1).
        rotations:
          type: array
          description: Rotation chain, oldest first.
          items:
            $ref: '#/components/schemas/JWS'
        revoked:
          type: array
          description: jti values of revoked, unexpired device and agent delegations.
          items:
            type: string
        srv_next:
          $ref: '#/components/schemas/PublicJWK'
          description: The server key this server will move to. Set by the server and not covered by the binding. The owner's app acts on it only when the same value is inside a fresh signed by the current server key, and SHOULD then publish a binding whose srv is this key.

    RedeemRequest:
      type: object
      required: [offer, requester]
      properties:
        offer:
          $ref: '#/components/schemas/JWS'
        requester:
          type: object
          description: The requester's own hashi.
          required: [hashi]
          properties:
            hashi:
              $ref: '#/components/schemas/Hashi'
          additionalProperties: false
        offer_back:
          $ref: '#/components/schemas/JWS'
          description: A one-time offer of the redeemer's own, for the owner to accept when confirming them. Its hashi MUST be requester.hashi. Apps SHOULD send one unless the user turns this off (specification Section 8.2).

    RedeemStatusRequest:
      type: object
      required: [hashi, requester]
      properties:
        hashi:
          $ref: '#/components/schemas/Hashi'
          description: The owner's hashi, whose offer the caller redeemed.
        requester:
          type: object
          description: The caller's own hashi.
          required: [hashi]
          properties:
            hashi:
              $ref: '#/components/schemas/Hashi'
          additionalProperties: false
      additionalProperties: false

    RedeemStatus:
      type: object
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
          description: True once the owner has given the caller a level of 1 or more. Never the level.
      additionalProperties: false

    ServerDocument:
      type: object
      required: [version, endpoint, srv]
      properties:
        version:
          $ref: '#/components/schemas/HashiDocument/properties/version'
        endpoint:
          $ref: '#/components/schemas/HttpsUrl'
          description: The endpoint that hashi documents on this domain use.
        srv:
          $ref: '#/components/schemas/PublicJWK'
          description: The server key, which a first binding names.
        signup:
          $ref: '#/components/schemas/HttpsUrl'
          description: The sign-up page, opened in the device's default browser app with hashi and hid in the fragment. Left out if the server has none.
        account:
          $ref: '#/components/schemas/HttpsUrl'
          description: Where people manage their account with this server, including terms, privacy and deleting their hashi.

    ShortLinkCode:
      type: string
      description: A short link's code, 16 letters and digits chosen at random (about 95 bits).
      pattern: '^[A-Za-z0-9]{16}$'

    StoredOffer:
      type: object
      required: [offer]
      properties:
        offer:
          $ref: '#/components/schemas/JWS'
      additionalProperties: false

    StoreOfferResponse:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/ShortLinkCode'

    ThreadId:
      type: string
      description: Thread ID. A new thread's ID carries at least 128 bits of randomness; replies repeat it.
      pattern: '^[A-Za-z0-9_-]{16,64}$'

    JWE:
      type: object
      description: |
        JWE in General JSON Serialization (RFC 7516), alg ECDH-ES+A256KW,
        enc A256GCM, with each recipient's kid naming the key it is sealed
        to. A message envelope is sealed to the receiving owner's inbox key
        alone, and its plaintext is a compact JWS (typ hashi-msg+jwt) signed
        by the sender's agent key. It MUST NOT use zip.
      required: [protected, recipients, iv, ciphertext, tag]
      properties:
        protected:
          type: string
        unprotected:
          type: object
        recipients:
          type: array
          minItems: 1
          items:
            type: object
            required: [header, encrypted_key]
            properties:
              header:
                type: object
                required: [kid]
                properties:
                  kid:
                    type: string
              encrypted_key:
                type: string
        iv:
          type: string
        ciphertext:
          type: string
          description: The stamp's ct is the SHA-256 of the bytes this decodes to, not of the base64url text.
        tag:
          type: string

    SendRequest:
      type: object
      required: [to, from, thread]
      additionalProperties: false
      description: Outside the envelope, messages carry no free-text fields.
      properties:
        to:
          $ref: '#/components/schemas/Hashi'
        from:
          $ref: '#/components/schemas/Hashi'
        intent:
          $ref: '#/components/schemas/Intent'
        thread:
          $ref: '#/components/schemas/ThreadId'
        envelope:
          $ref: '#/components/schemas/JWE'
        reply_token:
          $ref: '#/components/schemas/JWS'
          description: A reply token (typ hashi-reply+jwt) the sender offers the recipient.

    SendAccepted:
      type: object
      required: [result, id]
      properties:
        result:
          const: 'yea'
        id:
          type: string
          description: Inbox message ID.

    SendRejected:
      type: object
      required: [result]
      properties:
        result:
          const: 'nah'
      additionalProperties: false
      description: Carries no reason; identical however it was reached.

    InboxEntry:
      type: object
      required: [id, queue, stamp]
      properties:
        id:
          type: string
        queue:
          type: string
          enum: [incoming, processing]
        stamp:
          $ref: '#/components/schemas/JWS'
          description: Server-key-signed stamp (typ hashi-stamp+jwt) with sender, level, intent, thread and ciphertext hash (ct, the SHA-256 of the decoded ciphertext bytes).
        envelope:
          $ref: '#/components/schemas/JWE'
        reply_token:
          $ref: '#/components/schemas/JWS'
        claimed_by:
          type: [string, 'null']
          description: jti of the claiming agent's delegation, for messages in processing. A renewed delegation for the same signing key counts as the same agent.

    InboxList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/InboxEntry'

    WakeChannels:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            type: string
            examples: ['webpush']

    WakeRegistration:
      type: object
      required: [channel, params]
      properties:
        channel:
          type: string
        params:
          type: object
          description: Channel-specific. For webpush, the agent's or app's push subscription.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string
